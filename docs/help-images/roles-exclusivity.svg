<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f2f4f1"/><text x="70" y="62" font-family="Arial" font-size="12" font-weight="700" fill="#247483">PLANNINGROLLEN</text><text x="70" y="104" font-family="Arial" font-size="36" font-weight="700" fill="#183038">Wie doet mee, en wie blokkeert tijd?</text>
  <g font-family="Arial"><rect x="70" y="145" width="330" height="430" rx="18" fill="white" stroke="#dce3e0"/><circle cx="105" cy="186" r="11" fill="#ec4899"/><text x="128" y="193" font-size="21" font-weight="700" fill="#183038">Kapster</text><text x="96" y="228" font-size="12" fill="#62757b">Rol: hairdresser</text><text x="96" y="251" font-size="12" fill="#62757b">Scope: hair_salon</text><rect x="96" y="285" width="20" height="20" rx="4" fill="#247483"/><path d="M101 295l4 4 7-9" fill="none" stroke="white" stroke-width="2"/><text x="128" y="300" font-size="14" fill="#183038">Verplicht</text><rect x="96" y="326" width="20" height="20" rx="4" fill="white" stroke="#9eafaa"/><text x="128" y="341" font-size="14" fill="#183038">Meerdere toestaan</text><rect x="96" y="367" width="20" height="20" rx="4" fill="#247483"/><path d="M101 377l4 4 7-9" fill="none" stroke="white" stroke-width="2"/><text x="128" y="382" font-size="14" font-weight="700" fill="#183038">Exclusief / blokkeert tijd</text><rect x="96" y="427" width="278" height="100" rx="10" fill="#fff7f5"/><text x="112" y="452" font-size="12" font-weight="700" fill="#a43d2b">Gevolg</text><text x="112" y="476" font-size="12" fill="#183038">Kim kan niet tegelijk in twee</text><text x="112" y="495" font-size="12" fill="#183038">afspraken worden geboekt.</text>
  <rect x="435" y="145" width="330" height="430" rx="18" fill="white" stroke="#dce3e0"/><circle cx="470" cy="186" r="11" fill="#64748b"/><text x="493" y="193" font-size="21" font-weight="700" fill="#183038">Klant</text><text x="461" y="228" font-size="12" fill="#62757b">Rol: salon_customer</text><text x="461" y="251" font-size="12" fill="#62757b">Scope: hair_salon</text><rect x="461" y="285" width="20" height="20" rx="4" fill="#247483"/><path d="M466 295l4 4 7-9" fill="none" stroke="white" stroke-width="2"/><text x="493" y="300" font-size="14" fill="#183038">Verplicht</text><rect x="461" y="326" width="20" height="20" rx="4" fill="white" stroke="#9eafaa"/><text x="493" y="341" font-size="14" fill="#183038">Meerdere toestaan</text><rect x="461" y="367" width="20" height="20" rx="4" fill="white" stroke="#9eafaa"/><text x="493" y="382" font-size="14" fill="#183038">Niet exclusief</text><rect x="461" y="427" width="278" height="100" rx="10" fill="#f3f7f6"/><text x="477" y="452" font-size="12" font-weight="700" fill="#174d58">Gevolg</text><text x="477" y="476" font-size="12" fill="#183038">De klant is gekoppeld, maar is</text><text x="477" y="495" font-size="12" fill="#183038">geen schaarse resource.</text>
  <rect x="800" y="145" width="330" height="430" rx="18" fill="white" stroke="#dce3e0"/><circle cx="835" cy="186" r="11" fill="#8b5cf6"/><text x="858" y="193" font-size="21" font-weight="700" fill="#183038">Stoel</text><text x="826" y="228" font-size="12" fill="#62757b">Rol: salon_station</text><text x="826" y="251" font-size="12" fill="#62757b">Scope: hair_salon</text><rect x="826" y="285" width="20" height="20" rx="4" fill="white" stroke="#9eafaa"/><text x="858" y="300" font-size="14" fill="#183038">Optioneel</text><rect x="826" y="326" width="20" height="20" rx="4" fill="white" stroke="#9eafaa"/><text x="858" y="341" font-size="14" fill="#183038">Meerdere toestaan</text><rect x="826" y="367" width="20" height="20" rx="4" fill="#247483"/><path d="M831 377l4 4 7-9" fill="none" stroke="white" stroke-width="2"/><text x="858" y="382" font-size="14" font-weight="700" fill="#183038">Exclusief / blokkeert tijd</text><rect x="826" y="427" width="278" height="100" rx="10" fill="#fff7f5"/><text x="842" y="452" font-size="12" font-weight="700" fill="#a43d2b">Gevolg</text><text x="842" y="476" font-size="12" fill="#183038">Stoel 1 kan niet dubbel worden</text><text x="842" y="495" font-size="12" fill="#183038">gereserveerd.</text></g>
</svg>
